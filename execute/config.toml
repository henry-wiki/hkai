# HKAI.exe 設定（改完重開 HKAI.exe 即生效·唔使 build）
mode = "live"                    # live = 用本檔；builtin = 用 exe 內建值
on_close_script = ""
web_dir = ".."                         # 站根（相對 exe）＝ sc-hkai（Apache DocumentRoot）
php_dir = "bin/php-8.4.26"             # PHP 資料夾（相對 exe；換版本只改呢行）
apache_dir = "bin/apache-2.4.54"       # Apache 資料夾（升級＝改呢行）
custom_dir = "bin/custom"             # 外部設定接口目錄（00-paths.conf／第三方 module）
ports = [[7000, 7999], [3000, 3999], [13000, 13999]]

[splash]
width = 360
height = 240
min_ms = 1000

# --- Apache（UI 由內建 Apache＋php-cgi 提供）---------------------------
# {site}＝站根；{root}＝execute；{port}＝隨機可用埠
[[children]]
exe = "bin/apache-2.4.54/bin/httpd.exe"
args = ["-d", "{root}/{apache_dir}", "-f", "conf/httpd-exe.conf"]
