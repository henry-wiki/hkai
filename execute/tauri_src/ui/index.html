<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>HKAI</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#15171b;color:#e6e8ec;
       font:14px/1.6 "Segoe UI",system-ui,sans-serif}
  .box{text-align:center}
  .spinner{width:26px;height:26px;margin:0 auto 14px;border:3px solid #2a2f37;border-top-color:#4f8cff;
           border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title{font-weight:600;letter-spacing:.08em}
</style></head>
<body><div class="box"><div class="spinner"></div><div class="title">HKAI · 載入中</div></div></body></html>
